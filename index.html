<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر الهواتف والإكسسوارات الشامل</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; }
    header { background: #fff; border-bottom: 1px solid var(--border); padding: 1rem; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.2rem; color: var(--primary); }
    .cart-btn { background: var(--primary); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-weight: bold; }
    .categories { display: flex; gap: 0.5rem; overflow-x: auto; padding: 1rem; background: #fff; border-bottom: 1px solid var(--border); }
    .cat-btn { background: #f1f5f9; border: none; padding: 0.4rem 0.8rem; border-radius: 15px; cursor: pointer; white-space: nowrap; font-size: 0.9rem; }
    .cat-btn.active { background: var(--primary); color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; padding: 1rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 160px; object-fit: contain; background: #f8fafc; padding: 0.5rem; }
    .card-content { padding: 0.8rem; }
    .card-title { font-size: 0.95rem; margin-bottom: 0.3rem; height: 2.6em; overflow: hidden; }
    .card-price { color: var(--primary); font-weight: bold; font-size: 1.1rem; margin-bottom: 0.5rem; }
    .add-btn { width: 100%; background: #eff6ff; color: var(--primary); border: 1px solid var(--primary); padding: 0.5rem; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .add-btn:active { background: var(--primary); color: #fff; }
    
    /* Modal Cart */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: flex-end; }
    .modal-content { background: #fff; width: 100%; max-height: 80vh; border-radius: 20px 20px 0 0; padding: 1.5rem; overflow-y: auto; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    .checkout-btn { width: 100%; background: #25d366; color: #fff; border: none; padding: 1rem; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 1rem; }
  </style>
</head>
<body>

  <header>
    <h1>📱 متجر الهواتف الشامل (2021 - 2026)</h1>
    <button class="cart-btn" onclick="openCart()">السلة (<span id="cart-count">0</span>)</button>
  </header>

  <div class="categories">
    <button class="cat-btn active" onclick="filterCat('all')">الكل</button>
    <button class="cat-btn" onclick="filterCat('iphone')">آبل (iPhone)</button>
    <button class="cat-btn" onclick="filterCat('samsung')">سامسونج (Samsung)</button>
    <button class="cat-btn" onclick="filterCat('pixel')">جوجل (Pixel)</button>
    <button class="cat-btn" onclick="filterCat('xiaomi')">شاومي (Xiaomi)</button>
    <button class="cat-btn" onclick="filterCat('acc')">إكسسوارات</button>
  </div>

  <div class="grid" id="products-grid"></div>

  <!-- Cart Modal -->
  <div class="modal" id="cart-modal">
    <div class="modal-content">
      <h2>سلة الشراء</h2>
      <div id="cart-items" style="margin-top: 1rem;"></div>
      <h3 style="margin-top: 1rem;">المجموع: $<span id="cart-total">0</span></h3>
      <button class="checkout-btn" onclick="sendWhatsApp()">إتمام الطلب عبر WhatsApp 💬</button>
      <button onclick="closeCart()" style="width: 100%; margin-top: 0.5rem; padding: 0.8rem; border: none; background: #f1f5f9; border-radius: 8px;">إغلاق</button>
    </div>
  </div>

  <script>
    const products = [
      // 🍎 Apple iPhone (2021 - 2026)
      { id: 1, name: "iPhone 16 Pro Max", category: "iphone", price: 1199, img: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=500" },
      { id: 2, name: "iPhone 16 / 16 Plus", category: "iphone", price: 799, img: "https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5?w=500" },
      { id: 3, name: "iPhone 15 Pro Max", category: "iphone", price: 999, img: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=500" },
      { id: 4, name: "iPhone 15 / 15 Plus", category: "iphone", price: 699, img: "https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=500" },
      { id: 5, name: "iPhone 14 Pro Max", category: "iphone", price: 850, img: "https://images.unsplash.com/photo-1678685888221-cda773a3dcdb?w=500" },
      { id: 6, name: "iPhone 14 / 14 Plus", category: "iphone", price: 599, img: "https://images.unsplash.com/photo-1663499482523-1c0c1bae4ce1?w=500" },
      { id: 7, name: "iPhone 13 Pro Max", category: "iphone", price: 720, img: "https://images.unsplash.com/photo-1632661674596-df8be070a5c5?w=500" },
      { id: 8, name: "iPhone 13 / 13 mini", category: "iphone", price: 499, img: "https://images.unsplash.com/photo-1616348436168-de43ad0db179?w=500" },
      { id: 9, name: "iPhone 12 Pro Max", category: "iphone", price: 580, img: "https://images.unsplash.com/photo-1605236453806-6ff36851218e?w=500" },
      { id: 10, name: "iPhone 12 / 12 mini", category: "iphone", price: 399, img: "https://images.unsplash.com/photo-1603921326210-6edd2d60ca68?w=500" },

      // 📱 Samsung Galaxy S & Fold (2021 - 2026)
      { id: 11, name: "Samsung Galaxy S26 Ultra", category: "samsung", price: 1299, img: "https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=500" },
      { id: 12, name: "Samsung Galaxy S25 Ultra", category: "samsung", price: 1099, img: "https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=500" },
      { id: 13, name: "Samsung Galaxy S24 Ultra", category: "samsung", price: 899, img: "https://images.unsplash.com/photo-1583573636246-18cb82413e91?w=500" },
      { id: 14, name: "Samsung Galaxy S23 Ultra", category: "samsung", price: 750, img: "https://images.unsplash.com/photo-1675789069637-2591a7f7229e?w=500" },
      { id: 15, name: "Samsung Galaxy S22 Ultra", category: "samsung", price: 580, img: "https://images.unsplash.com/photo-1644797460980-d31e6754b2d3?w=500" },
      { id: 16, name: "Samsung Galaxy S21 Ultra", category: "samsung", price: 450, img: "https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=500" },
      { id: 17, name: "Samsung Z Fold 6 / Z Flip 6", category: "samsung", price: 1399, img: "https://images.unsplash.com/photo-1580910051074-3eb694886505?w=500" },
      { id: 18, name: "Samsung Z Fold 5 / Z Flip 5", category: "samsung", price: 999, img: "https://images.unsplash.com/photo-1580910051074-3eb694886505?w=500" },

      // 🌐 Google Pixel & Xiaomi
      { id: 19, name: "Google Pixel 9 Pro", category: "pixel", price: 999, img: "https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=500" },
      { id: 20, name: "Google Pixel 8 Pro", category: "pixel", price: 699, img: "https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=500" },
      { id: 21, name: "Google Pixel 7 Pro", category: "pixel", price: 499, img: "https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=500" },
      { id: 22, name: "Xiaomi 14 Ultra", category: "xiaomi", price: 899, img: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500" },
      { id: 23, name: "Xiaomi 13 Pro", category: "xiaomi", price: 599, img: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500" },

      // 🎧 Accessories
      { id: 24, name: "Apple AirPods Pro 2", category: "acc", price: 229, img: "https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=500" },
      { id: 25, name: "Samsung Galaxy Buds 3 Pro", category: "acc", price: 199, img: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=500" },
      { id: 26, name: "شاحن سريع 20W آبل أصلي", category: "acc", price: 25, img: "https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=500" },
      { id: 27, name: "شاحن سامسونج 45W Ultra Fast", category: "acc", price: 35, img: "https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=500" },
      { id: 28, name: "MagSafe Wireless Charger", category: "acc", price: 40, img: "https://images.unsplash.com/photo-1622445268465-8378c6824139?w=500" }
    ];

    let cart = [];

    function renderProducts(items) {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = items.map(p => `
        <div class="card">
          <img src="${p.img}" alt="${p.name}" loading="lazy">
          <div class="card-content">
            <div class="card-title">${p.name}</div>
            <div class="card-price">$${p.price}</div>
            <button class="add-btn" onclick="addToCart(${p.id})">إضافة للسلة</button>
          </div>
        </div>
      `).join('');
    }

    function filterCat(category) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      if (category === 'all') renderProducts(products);
      else renderProducts(products.filter(p => p.category === category));
    }

    function addToCart(id) {
      const item = products.find(p => p.id === id);
      cart.push(item);
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cart-count').innerText = cart.length;
      const itemsContainer = document.getElementById('cart-items');
      let total = 0;
      itemsContainer.innerHTML = cart.map((item, index) => {
        total += item.price;
        return `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong>
              <div style="color:var(--primary);">$${item.price}</div>
            </div>
            <button onclick="removeFromCart(${index})" style="background:#fee2e2; color:#ef4444; border:none; padding:0.3rem 0.6rem; border-radius:6px; cursor:pointer;">حذف</button>
          </div>
        `;
      }).join('');
      document.getElementById('cart-total').innerText = total;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function openCart() { document.getElementById('cart-modal').style.display = 'flex'; }
    function closeCart() { document.getElementById('cart-modal').style.display = 'none'; }

    function sendWhatsApp() {
      if (cart.length === 0) return alert('السلة فارغة!');
      let text = "مرحباً، أريد طلب الأجهزة التالية من المتجر:\n\n";
      let total = 0;
      cart.forEach((item, i) => {
        text += `${i+1}. ${item.name} - $${item.price}\n`;
        total += item.price;
      });
      text += `\nالمجموع الكلي: $${total}`;
      const phone = "970592152484";
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
    }

    // Initial Render
    renderProducts(products);
  </script>
</body>
</html>
