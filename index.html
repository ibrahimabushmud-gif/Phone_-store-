<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر الهواتف والإكسسوارات</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 80px;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary);
    }

    .cart-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .product-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: #eee;
    }

    .product-info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }

    .product-price {
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .add-to-cart-btn {
      margin-top: auto;
      background-color: var(--bg);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 0.5rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    .add-to-cart-btn:active {
      background-color: var(--primary);
      color: white;
    }

    /* Shopping Cart Modal */
    .cart-modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .cart-modal.active {
      display: flex;
    }

    .cart-content {
      background-color: var(--card-bg);
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-total {
      margin-top: 1rem;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
    }

    .checkout-form {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .checkout-form input {
      padding: 0.6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .submit-btn {
      background-color: #25d366;
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">متجر الموبايلات والملحقات</div>
    <button class="cart-btn" onclick="toggleCart()">السلة (<span id="cart-count">0</span>)</button>
  </header>

  <div class="container">
    <div class="products-grid" id="products-container"></div>
  </div>

  <!-- Cart Modal -->
  <div class="cart-modal" id="cart-modal">
    <div class="cart-content">
      <div class="cart-header">
        <h3>سلة التسوق</h3>
        <button class="close-btn" onclick="toggleCart()">&times;</button>
      </div>
      
      <div id="cart-items"></div>
      
      <div class="cart-total">
        <span>المجموع:</span>
        <span id="cart-total-price">$0</span>
      </div>

      <form class="checkout-form" onsubmit="sendOrder(event)">
        <input type="text" id="cust-name" placeholder="اسمك الكامل" required>
        <input type="tel" id="cust-phone" placeholder="رقم الهاتف للتواصل" required>
        <button type="submit" class="submit-btn">إرسال الطلب عبر الواتساب</button>
      </form>
    </div>
  </div>

  <script>
    // 1. قائمة منتجات الأجهزة والملحقات
    const products = [
      // --- الهواتف الذكية ---
      { id: 1, name: "iPhone 15 Pro Max", price: 1199, img: "https://via.placeholder.com/200?text=iPhone+15+Pro+Max" },
      { id: 2, name: "iPhone 13 Pro", price: 699, img: "https://via.placeholder.com/200?text=iPhone+13+Pro" },
      { id: 3, name: "Samsung Galaxy S24 Ultra", price: 1299, img: "https://via.placeholder.com/200?text=Galaxy+S24+Ultra" },
      { id: 4, name: "Samsung Galaxy S21 FE", price: 420, img: "https://via.placeholder.com/200?text=Galaxy+S21+FE" },
      { id: 5, name: "Xiaomi Redmi Note 13 Pro", price: 299, img: "https://via.placeholder.com/200?text=Redmi+Note+13+Pro" },
      { id: 6, name: "Google Pixel 8 Pro", price: 899, img: "https://via.placeholder.com/200?text=Pixel+8+Pro" },

      // --- السماعات ---
      { id: 7, name: "سماعات Apple AirPods Pro 2", price: 249, img: "https://via.placeholder.com/200?text=AirPods+Pro+2" },
      { id: 8, name: "سماعات Redmi Buds 5 Pro", price: 65, img: "https://via.placeholder.com/200?text=Redmi+Buds+5" },
      { id: 9, name: "سماعات Samsung Galaxy Buds 2 Pro", price: 160, img: "https://via.placeholder.com/200?text=Galaxy+Buds+2+Pro" },
      { id: 10, name: "سماعات رأس Sony WH-1000XM5", price: 380, img: "https://via.placeholder.com/200?text=Sony+WH-1000XM5" },

      // --- الساعات الذكية ---
      { id: 11, name: "ساعة Apple Watch Series 9", price: 399, img: "https://via.placeholder.com/200?text=Apple+Watch+9" },
      { id: 12, name: "ساعة Samsung Galaxy Watch 6", price: 280, img: "https://via.placeholder.com/200?text=Galaxy+Watch+6" },

      // --- الشواحن والملحقات ---
      { id: 13, name: "شاحن Apple الأصلي 20W Type-C", price: 25, img: "https://via.placeholder.com/200?text=Apple+20W+Charger" },
      { id: 14, name: "شاحن سريع Anker 65W Fast Charger", price: 45, img: "https://via.placeholder.com/200?text=Anker+65W+Charger" },
      { id: 15, name: "كفر حماية سيليكون لآيفون MagSafe", price: 15, img: "https://via.placeholder.com/200?text=iPhone+Clear+Case" },
      { id: 16, name: "كفر حماية مقاوم الصدمات لسامسونج S24", price: 18, img: "https://via.placeholder.com/200?text=Samsung+Armor+Case" }
    ];

    let cart = [];

    // 2. عرض المنتجات
    function renderProducts() {
      const container = document.getElementById('products-container');
      container.innerHTML = products.map(p => `
        <div class="product-card">
          <img src="${p.img}" alt="${p.name}" class="product-img">
          <div class="product-info">
            <div class="product-title">${p.name}</div>
            <div class="product-price">$${p.price}</div>
            <button class="add-to-cart-btn" onclick="addToCart(${p.id})">إضافة للسلة</button>
          </div>
        </div>
      `).join('');
    }

    // 3. إضافة منتج للسلة
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const existing = cart.find(item => item.id === productId);

      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
    }

    // 4. تحديث السلة
    function updateCartUI() {
      const cartItemsContainer = document.getElementById('cart-items');
      const cartCount = document.getElementById('cart-count');
      const cartTotalPrice = document.getElementById('cart-total-price');

      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      cartCount.textContent = totalItems;
      cartTotalPrice.textContent = `$${totalPrice}`;

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = '<p style="text-align:center; padding: 1rem; color: #64748b;">السلة فارغة</p>';
        return;
      }

      cartItemsContainer.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <strong>${item.name}</strong><br>
            <small>$${item.price} × ${item.qty}</small>
          </div>
          <div>
            <button onclick="changeQty(${item.id}, -1)">-</button>
            <span style="margin: 0 5px;">${item.qty}</span>
            <button onclick="changeQty(${item.id}, 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    function changeQty(id, change) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty += change;
        if (item.qty <= 0) {
          cart = cart.filter(i => i.id !== id);
        }
      }
      updateCartUI();
    }

    function toggleCart() {
      document.getElementById('cart-modal').classList.toggle('active');
    }

    // 5. إرسال الطلب عبر الواتساب إلى رقمك المباشر
    function sendOrder(e) {
      e.preventDefault();
      if (cart.length === 0) {
        alert("السلة فارغة!");
        return;
      }

      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      
      // رقم الهاتف المباشر
      const myPhoneNumber = "970592152484"; 

      let message = `طلب جديد من: ${name}\nرقم زبون التواصل: ${phone}\n\nالمنتجات المطلوب شراءها:\n`;
      cart.forEach(item => {
        message += `- ${item.name} (العدد: ${item.qty}) = $${item.price * item.qty}\n`;
      });
      
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      message += `\nالمجموع الكلي: $${totalPrice}`;

      const encodedMessage = encodeURIComponent(message);
      window.open(`https://wa.me/${myPhoneNumber}?text=${encodedMessage}`, '_blank');
    }

    renderProducts();
  </script>
</body>
</html>
